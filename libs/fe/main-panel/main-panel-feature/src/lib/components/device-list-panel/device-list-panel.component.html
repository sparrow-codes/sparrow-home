@if (isLoading()) {
  <ion-skeleton-text [animated]="true" class="h-20"></ion-skeleton-text>
} @else if (haveInitialData()) {
  <ion-item [button]="true" [routerLink]="['../', 'devices']" lines="none"
            [queryParams]="{ deviceType: '' }">
    <div
      class="flex items-center justify-between w-full hover:bg-transparent transition text-inherit ion-padding-vertical"
      [routerLink]="['../', 'devices']"
      [queryParams]="{ deviceType: '' }"
      [attr.aria-label]="'main_panel.go_to_devices_list' | translate"
    >
      <div class="flex items-center gap-3">
        <div class="p-2 bg-gray-700 rounded-md flex items-center justify-center text-surface-0">
          <ng-icon name="bootstrapDeviceHdd" size="24px" class="text-white"></ng-icon>
        </div>
        <div class="flex flex-col gap-1">
          <div class="font-semibold">{{ 'main_panel.manage_devices' | translate }}</div>
          <div class="text-sm">{{ 'main_panel.available_devices' | translate: { nrOfDevices: nrOfDevices() ?? 0 } }}
          </div>
        </div>
      </div>
    </div>

  </ion-item>
}
