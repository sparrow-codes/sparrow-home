<button pButton severity="secondary" rounded size="small" class="flex justify-between gap-2 items-center" routerLink="vacation-mode">
    <ng-icon name="bootstrapAirplaneFill" class="text-2xl" [class.text-green-600]="isVacationMode()"></ng-icon>
    <div class="flex flex-col gap-1 items-start">
        <span>{{'main_panel.vacation_mode' | translate }}</span>
        @if (isVacationMode()) {
            <span class="opacity-75 text-green-800 dark:text-green-500">{{'main_panel.active' | translate }}</span>
        } @else {
            <span class="opacity-75">{{'main_panel.inactive' | translate }}</span>
        }
    </div>
    <ng-icon name="bootstrapChevronRight"></ng-icon>
</button>
