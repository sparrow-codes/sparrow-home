<ion-button shape="round" routerLink="vacation-mode">
    <ng-icon name="bootstrapAirplaneFill" class="text-2xl" [class.text-[var(--ion-color-success)]]="isVacationMode()"></ng-icon>
    <div class="flex flex-col gap-1 items-start mr-2 ml-4">
        <span>{{'main_panel.vacation_mode' | translate }}</span>
        @if (isVacationMode()) {
            <span class="opacity-75 text-[var(--ion-color-success)]">{{'main_panel.active' | translate }}</span>
        } @else {
            <span class="opacity-75">{{'main_panel.inactive' | translate }}</span>
        }
    </div>
    <ng-icon name="bootstrapChevronRight"></ng-icon>
</ion-button>
