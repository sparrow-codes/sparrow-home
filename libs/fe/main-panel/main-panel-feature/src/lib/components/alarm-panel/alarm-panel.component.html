<ion-item lines="none">
  <div class="flex items-center justify-between w-full ion-padding-vertical">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-green-600 rounded-md flex items-center justify-center text-white">
        <ng-icon name="bootstrapBell" size="24px"></ng-icon>
      </div>
      <div>
        <div class="font-semibold text-base mb-2">{{ 'main_panel.alarm_home' | translate }}</div>

        @if (isAlarmOn()) {
          <ion-badge color="success">{{ 'main_panel.active' | translate }}</ion-badge>
        } @else {
          <ion-badge color="light">{{ 'main_panel.inactive' | translate }}</ion-badge>
        }

      </div>
    </div>
  </div>
    <ion-toggle slot="end"
      [(ngModel)]="isAlarmOn"></ion-toggle>
</ion-item>
