<ion-item lines="none" [button]="true" [routerLink]="routing() ?? ['details', device().id]"
          [attr.aria-label]="'ui.go_to_device_details' | translate : { deviceName: device().name }">
  <div
    class="flex items-center justify-between w-full cursor-pointer hover:opacity-80 transition ion-padding-vertical"
  >
    <div class="flex items-center gap-3">
      <sp-device-type [animationInProgress]="showFinishAnimation()" [fullLabel]="false" [deviceType]="device().type" />
      <div class="block">
        <div class="font-semibold text-sp-text">{{ device().name }}</div>
        @if (label()) {
          <ion-badge color="light" class="mt-2">{{ label() | translate | humanize }}</ion-badge>
        } @else {
          <div class="text-sp-text-muted text-sm mt-2">{{ deviceTypeLabel() | translate | humanize }}</div>
        }
      </div>
    </div>

    @if (mainAction(); as mainAction) {
      <sp-device-action
        (click)="$event.stopPropagation(); $event.preventDefault()"
        (callAction)="onDeviceEvent($event)"
        [short]="true"
        [action]="mainAction"
      ></sp-device-action>
    }

  </div>
</ion-item>
