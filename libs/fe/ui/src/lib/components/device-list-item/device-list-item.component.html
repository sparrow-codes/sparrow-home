<ion-item lines="none" [button]="true" [routerLink]="routing() ?? ['details', device().id]"
          [attr.aria-label]="'ui.go_to_device_details' | translate : { deviceName: device().name }">
  <div
    class="flex items-center gap-3 w-full cursor-pointer hover:opacity-80 transition ion-padding-vertical"
  >
    <sp-device-type class="shrink-0" [animationInProgress]="showFinishAnimation()" [fullLabel]="false" [deviceType]="device().type" />
    <div class="flex min-w-0 flex-1 flex-col items-start">
      <div class="font-semibold text-sp-text">{{ device().name }}</div>

      <div class="mt-2 flex w-full items-center gap-2">
        <div class="min-w-0 flex-1">
          @if (label()) {
            <ion-badge color="light">{{ label() | translate | humanize }}</ion-badge>
          } @else {
            <div class="text-sp-text-muted text-sm">{{ deviceTypeLabel() | translate | humanize }}</div>
          }
        </div>
        @if (mainAction(); as mainAction) {
          <sp-device-action
            class="min-w-0 max-w-full"
            (click)="$event.stopPropagation(); $event.preventDefault()"
            (callAction)="onDeviceEvent($event)"
            [short]="true"
            [action]="mainAction"
          ></sp-device-action>
        }
      </div>
    </div>
  </div>
</ion-item>
