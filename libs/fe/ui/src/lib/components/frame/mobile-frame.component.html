<ion-tabs>
  <ion-tab-bar slot="bottom">
    @for (item of navigationItems; track item.routerLink) {
      <ion-tab-button
        [routerLink]="item.routerLink"
        [tab]="item.routerLink"
        routerLinkActive
        #rla="routerLinkActive"
      >
        <ng-icon aria-hidden="true" [name]="rla.isActive ? item.activeIcon : item.icon" size="1.25rem"></ng-icon>
        <span class="mt-1">{{ item.label | translate }}</span>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
