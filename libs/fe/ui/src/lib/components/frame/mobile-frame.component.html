<header
  class="hidden xl:block w-full border-b border-solid border-r-0 border-l-0 border-t-0 shadow-[0_1px_8px_rgba(0,0,0,0.06)] border-gray-200 dark:border-surface-700"
  style="view-transition-name: app-navbar"
>
  <nav class="flex gap-10 max-w-screen-xl m-auto p-4 items-center">
    @for (item of navigationItems; track item.routerLink) {
      @let isActive = webNavItem.classList.contains('active');

      <a #webNavItem
        class="flex items-center gap-2 transition-colors no-underline text-gray-500"
        [class.text-primary]="isActive"
        routerLinkActive="active"
        [routerLink]="item.routerLink"
        [attr.aria-current]="isActive ? 'page' : null"
      >
        <ng-icon aria-hidden="true" [name]="item.icon" size="1rem"></ng-icon>
        <span class="text-xl leading-none">{{ item.label | translate }}</span>
      </a>
    }
  </nav>
</header>
<main class="overflow-y-auto px-4 pt-4 pb-[calc(4.5rem+var(--safe-bottom))] max-w-screen-xl m-auto">
  <router-outlet></router-outlet>
</main>
<nav
  class="pb-[var(--safe-bottom)] fixed bottom-0 left-0 right-0 z-50 border-t border-solid border-r-0 border-l-0 border-b-0 shadow-[0_-1px_8px_rgba(0,0,0,0.06)] border-gray-200 bg-white xl:hidden dark:bg-surface-900 dark:border-surface-700"
  role="navigation"
  aria-label="Primary"
  style="view-transition-name: app-navbar"
>
  <div class="flex h-16">
    @for (item of navigationItems; track item.routerLink) {
      @let isActive = mobileNavItem.classList.contains('active');

      <a #mobileNavItem
         class="flex-1 flex flex-col items-center justify-center gap-1 transition-colors no-underline text-gray-500"
         [class.text-primary]="isActive"
         routerLinkActive="active"
         [routerLink]="item.routerLink"
         [attr.aria-current]="isActive ? 'page' : null"
      >
        <ng-icon aria-hidden="true" [name]="item.icon" size="1.25rem"></ng-icon>
        <span class="text-md leading-none">{{ item.label | translate }}</span>
      </a>
    }
  </div>
</nav>
