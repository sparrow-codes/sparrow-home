<div class="flex items-center gap-3 px-4 py-3">
  @if (showBackButton()) {
    <sp-back-button [disabled]="backButtonDisabled()"></sp-back-button>
  }

  <div class="min-w-0 flex-1 h-12 flex flex-col justify-center">
    <h1 class="m-0 truncate text-xl font-bold leading-tight text-[var(--ion-color-dark)]">
      {{ title() }}
    </h1>

    <p class="mt-1 mb-0 truncate text-sm leading-tight text-[var(--ion-color-medium)]">
      {{ subtitle() }}
    </p>
  </div>
</div>
