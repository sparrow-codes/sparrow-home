@if (fullLabel()) {
<div
  class="px-4 py-1 rounded max-w-fit font-bold truncate flex gap-2 items-center"
  [ngClass]="{
    'temperature-sensor': deviceType() === deviceTypes.TEMPERATURE_SENSOR,
    'open-door-sensor': deviceType() === deviceTypes.OPEN_DOOR_SENSOR,
    siren: deviceType() === deviceTypes.SIREN,
    pilot: deviceType() === deviceTypes.PILOT,
    other: deviceType() === deviceTypes.OTHER,
  }"
>
  <ng-icon [name]="iconName()" size="1.2rem"></ng-icon>

  {{ label() | translate }}
</div>
} @else {
<div
  class="p-2 flex justify-center items-center rounded-md"
  [ngClass]="{
    'temperature-sensor': deviceType() === deviceTypes.TEMPERATURE_SENSOR,
    'open-door-sensor': deviceType() === deviceTypes.OPEN_DOOR_SENSOR,
    siren: deviceType() === deviceTypes.SIREN,
    pilot: deviceType() === deviceTypes.PILOT,
    other: deviceType() === deviceTypes.OTHER,
  }"
>
  @if (animationInProgress()) {
  <sp-animated-check-circle width="24px" height="24px"></sp-animated-check-circle>
  } @else {
    <ng-icon class="text-white animate-fadein" [name]="iconName()" size="24px"></ng-icon>
  }
</div>
}
