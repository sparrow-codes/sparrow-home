<div class="flex gap-1 items-center">
  <ion-icon name="wifi-outline"></ion-icon>
  <span
    class="font-semibold w-[40px] text-end whitespace-nowrap"
    [class.text-[var(--ion-color-success)]]="signalStrength() > 60"
    [class.text-[var(--ion-color-warning)]]="signalStrength() <= 60 && signalStrength() > 10"
    [class.text-[var(--ion-color-danger)]]="signalStrength() <= 10"
    >{{ signalStrength() }}%</span
  >
</div>
