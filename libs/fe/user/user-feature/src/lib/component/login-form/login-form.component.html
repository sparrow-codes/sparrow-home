<form [formGroup]="loginForm" (ngSubmit)="onLoginClick()" class="flex flex-col gap-2">


  <ion-label>{{ 'user.email' | translate }}</ion-label>
  <ion-input class="mb-1" shape="round" mode="md" formControlName="email" fill="outline"
             [placeholder]="'user.email' | translate"></ion-input>

  <ion-label>{{'user.password' | translate }}</ion-label>
  <ion-input class="mb-1" shape="round" formControlName="password"
             [placeholder]="'user.password' | translate" type="password" mode="md" fill="outline">
    <ion-input-password-toggle slot="end"></ion-input-password-toggle>
  </ion-input>
  <ion-button [disabled]="isLoading()" type="submit">
    @if (!isLoading()) {
      {{ 'user.login' | translate }}
    } @else {
      <ion-spinner name="circular"></ion-spinner>
    }
  </ion-button>


  <a class="text-center text-primary mt-2" [routerLink]="['../', newUserLink()]">
    {{ 'user.create_account' | translate }}
  </a>


</form>
