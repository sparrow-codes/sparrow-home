@let isRefreshing = (isRefreshing$ | async) ?? false;

<ion-header class="ion-no-border">
  <ion-toolbar>
    <sp-page-title [showBackButton]="true" [title]="'tasks.edit_task' | translate" [subtitle]="'tasks.edit_task_subtitle' | translate"></sp-page-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if ((isLoading$ | async)) {
    <div class="flex flex-col ion-padding">
      <ion-skeleton-text [animated]="true" class="w-full h-[100px]"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" class="w-full h-[120px]"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" class="w-full h-[300px]"></ion-skeleton-text>
    </div>
  } @else {
    @if (task(); as task) {
      <div class="flex flex-col gap-2">
        <sp-schedule-settings
          [task]="task"
          [devices]="devices()"
          [isLoading]="isRefreshing"
          (taskChange)="onUpdateTask($event)"
        ></sp-schedule-settings>

        <div class="ion-padding-horizontal mb-4">
          <ion-button color="danger" fill="outline" expand="block" (click)="deleteTask()" [disabled]="isRefreshing">
            <ion-icon name="trash-outline" slot="start" />
            {{ 'tasks.delete' | translate }}
          </ion-button>
        </div>
      </div>
    }
  }
</ion-content>
