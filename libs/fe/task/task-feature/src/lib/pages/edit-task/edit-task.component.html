@let isRefreshing = (isRefreshing$ | async) ?? false;

<ion-header class="ion-no-border">
  <ion-toolbar>
    <sp-page-title [showBackButton]="true" [title]="'tasks.edit_task' | translate"></sp-page-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if ((isLoading$ | async)) {
    <div class="flex flex-col">
      <ion-skeleton-text [animated]="true" class="w-[60px] h-[25px]"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" class="w-full h-[43px]"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" class="w-full h-[300px]"></ion-skeleton-text>
    </div>
  } @else {
    @if (task(); as task) {
      <div class="flex flex-col gap-2">
        <sp-schedule-settings
          [task]="task"
          [devices]="devices()"
          [isLoading]="isRefreshing"
          (taskChange)="onUpdateTask($event)"
        ></sp-schedule-settings>

        <sp-divider></sp-divider>

        <ion-button color="danger" fill="outline" (click)="deleteTask()" [disabled]="isRefreshing">
          {{ 'tasks.delete' | translate }}
        </ion-button>
      </div>
    }
  }
</ion-content>
