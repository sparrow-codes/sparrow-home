@let runOnVacation = taskAction().runOnVacation;

<div class="flex justify-between items-center">
  <div class="flex gap-2">
    <ng-icon name="bootstrapAirplaneFill" [class.text-blue-500]="runOnVacation" class="rotate-45 mt-[1px]"></ng-icon>
    <span class="text-sm">{{ 'tasks.run_on_vacation' | translate }}</span>
  </div>
  <ion-toggle [ngModel]="runOnVacation" (ngModelChange)="updateModel($event)"></ion-toggle>
</div>
