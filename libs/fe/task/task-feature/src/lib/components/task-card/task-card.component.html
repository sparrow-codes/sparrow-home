<ion-item
  lines="none"
  [button]="true"
  [routerLink]="['edit', task().id]"
  [attr.aria-label]="('tasks.go_to_device_details' | translate) + task().id"
>
  <div class="flex items-center justify-between w-full cursor-pointer hover:opacity-80 transition ion-padding-vertical">
    <div class="flex items-center gap-3">
      <div class="w-[50px] h-[50px] bg-gray-700 rounded-md flex items-center justify-center text-white">
        @if (showFinishAnimation()) {
        <sp-animated-check-circle width="32px" height="32px"></sp-animated-check-circle>
        } @else {
        <ion-icon name="flash-outline" class="animate-fadein text-[32px]"></ion-icon>
        }
      </div>
      <div class="block">
        <div class="font-semibold text-surface-700 dark:text-surface-0">
          {{ task().name }}
        </div>

        @if (task().isActive) {
        <ion-badge color="success" class="w-[70px]">{{ 'tasks.active' | translate }}</ion-badge>
        } @else {
        <ion-badge color="medium" class="w-[70px]">{{ 'tasks.inactive' | translate }}</ion-badge>
        }
      </div>
    </div>

    <div>
      <ion-toggle
        (click)="$event.stopPropagation(); $event.preventDefault()"
        [checked]="task().isActive"
        (ionChange)="changeTaskStatus($event.detail.checked)"
      ></ion-toggle>
    </div>

  </div>
</ion-item>
